name: Miksigram Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [ mechagram-build ]

permissions:
  contents: read
  actions: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Stop unrelated builds for this Windows branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?branch=miksigram-build&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect this branch's workflow runs" }
          foreach ($run in $runs.workflow_runs) {
            if ($run.head_branch -eq 'miksigram-build' -and $run.name -ne 'Miksigram Windows' -and $run.status -ne 'completed') {
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/cancel"
              if ($LASTEXITCODE -ne 0) { Write-Warning "Run $($run.id) already finished or could not be cancelled" }
            }
          }

      - name: Prepare directories
        run: |
          mkdir "%USERPROFILE%\TBuild\Libraries"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Setup environment and keys
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          SDK="10.0.22621.0"
          if [ -f "$DOCPATH" ]; then
            PARSED_SDK="$(grep -o -E '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "$DOCPATH" | head -n 1 || true)"
            [ -n "$PARSED_SDK" ] && SDK="$PARSED_SDK"
          fi
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" 2>/dev/null | awk '{ print $1 }' || echo 'default')" > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "build@tdesktop.internal"
          git config --global user.name "Builder"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: ThirdParty Cache
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-x64-third-party-

      - name: Libraries Cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-release-libs-v1-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-x64-libs-v2-${{ env.CACHE_KEY }}

      - name: Qt Cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-release-qt6-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-x64-qt6-${{ env.CACHE_KEY }}

      - name: Prepare Libraries
        run: |
          cd "%TBUILD%\%REPO_NAME%"
          call Telegram\build\prepare\win.bat silent qt6

      - name: Save prepared Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-release-libs-v1-${{ env.CACHE_KEY }}

      - name: Save prepared Qt cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-release-qt6-${{ env.CACHE_KEY }}

      - name: Compress build output and dependencies
        shell: pwsh
        run: |
          $buildOutput = Join-Path $env:TBUILD "$env:REPO_NAME/out"
          New-Item -ItemType Directory -Path $buildOutput -Force | Out-Null
          foreach ($directory in @($buildOutput, $env:LibrariesPath)) {
            compact.exe /C "/S:$directory" /I /Q
            if ($LASTEXITCODE -ne 0) { throw "NTFS compression failed for $directory" }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Free, Used

      - name: Configure CMake
        run: |
          cd "%TBUILD%\%REPO_NAME%\Telegram"
          call configure.bat x64 qt6 ^
            -D TDESKTOP_API_TEST=ON ^
            -D CMAKE_CONFIGURATION_TYPES=Debug ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
            -D CMAKE_EXE_LINKER_FLAGS_DEBUG="/DEBUG:NONE /INCREMENTAL:NO" ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build Telegram
        env:
          _CL_: /MP1
        run: |
          cd "%TBUILD%\%REPO_NAME%"
          cmake --build out --config Debug --target Telegram --parallel 2 -- /bl:miksigram-build.binlog

      - name: Prepare Artifacts
        run: |
          mkdir "%GITHUB_WORKSPACE%\artifact"
          copy "%TBUILD%\%REPO_NAME%\out\Debug\Telegram.exe" "%GITHUB_WORKSPACE%\artifact\Miksigram.exe" || copy "%TBUILD%\%REPO_NAME%\out\bin\Telegram.exe" "%GITHUB_WORKSPACE%\artifact\Miksigram.exe"

      - name: Upload Telegram Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: Miksigram-Desktop-Win64
          path: artifact\Miksigram.exe

      - name: Build Miksigram installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $repo = Join-Path $env:TBUILD $env:REPO_NAME
          $version = ((Get-Content (Join-Path $repo 'Telegram\build\version')) -match '^AppVersionStr\s' | Select-Object -First 1) -replace '^AppVersionStr\s+', ''
          $version = $version.Trim()
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifact\Miksigram.exe'
          $out = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $iscc "/DAppVersion=$version" "/DSourceExe=$exe" "/DOutputDir=$out" (Join-Path $repo 'Telegram\build\miksigram-setup.iss')
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem $out

      - name: Upload Miksigram installer
        uses: actions/upload-artifact@v4
        with:
          name: Miksigram-Setup-Win64
          path: installer\*.exe
          if-no-files-found: error

      - name: Upload Windows build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miksigram-windows-build-diagnostics
          path: ${{ env.TBUILD }}/${{ env.REPO_NAME }}/out/miksigram-build.binlog
          if-no-files-found: ignore
